<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | RaveLore</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.jpg">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="index.html"><img src="assets/icon.jpg" alt="" width="36" height="36"><span>RaveLore</span></a>
      <nav class="lang-nav" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="tr">Türkçe</button>
      </nav>
    </header>
    <main>
      <div class="card">
        <h2 id="title">Reset your password</h2>

        <form id="request-form">
          <p id="request-help" class="muted">Enter the email you signed up with. We will send you a link to choose a new password.</p>
          <div>
            <label id="email-label" for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>
          <button class="primary" id="request-btn" type="submit">Send reset link</button>
        </form>

        <form id="set-form" hidden>
          <p id="set-help" class="muted">Choose a new password (at least 8 characters).</p>
          <div>
            <label id="pw-label" for="pw">New password</label>
            <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div>
            <label id="pw2-label" for="pw2">Repeat password</label>
            <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="primary" id="set-btn" type="submit">Save new password</button>
        </form>

        <p class="status" id="status" role="status"></p>
      </div>
    </main>
    <footer class="site-footer">
      <nav>
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </nav>
      <p>&copy; 2026 Kam Interactive</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/lang.js"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://mnlecypdubpcwthgrhzf.supabase.co'
      // Public publishable key: the same one the app ships with. It carries no extra rights.
      var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ubGVjeXBkdWJwY3d0aGdyaHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNzkyMTcsImV4cCI6MjEwMzY1NTIxN30.WnmB2jb5K5g-h8d3lfKCRylF4uSFGvPyUDVUheVJloY'

      var T = {
        en: {
          title: 'Reset your password', requestHelp: 'Enter the email you signed up with. We will send you a link to choose a new password.',
          email: 'Email', send: 'Send reset link', setHelp: 'Choose a new password (at least 8 characters).',
          pw: 'New password', pw2: 'Repeat password', save: 'Save new password',
          sent: 'If that email has an account, a link is on its way. Open it on this device.',
          mismatch: 'The passwords do not match.', short: 'Use at least 8 characters.',
          done: 'Your password was changed. You can now sign in to RaveLore with it.',
          failed: 'Something went wrong. Please request a new link and try again.',
          expired: 'This link is invalid or has expired. Enter your email to get a new one.',
          oldLink: 'This link was created inside the app and cannot be used here. Enter your email below to get a new one.'
        },
        tr: {
          title: 'Şifreni sıfırla', requestHelp: 'Kayıt olduğun e-postayı yaz. Yeni şifre seçmen için bir bağlantı göndereceğiz.',
          email: 'E-posta', send: 'Sıfırlama bağlantısı gönder', setHelp: 'Yeni bir şifre seç (en az 8 karakter).',
          pw: 'Yeni şifre', pw2: 'Şifreyi tekrarla', save: 'Yeni şifreyi kaydet',
          sent: 'Bu e-postaya ait bir hesap varsa bağlantı yolda. Onu bu cihazda aç.',
          mismatch: 'Şifreler uyuşmuyor.', short: 'En az 8 karakter kullan.',
          done: 'Şifren değiştirildi. Artık RaveLore\'a bu şifreyle giriş yapabilirsin.',
          failed: 'Bir şeyler ters gitti. Lütfen yeni bir bağlantı iste ve tekrar dene.',
          expired: 'Bu bağlantı geçersiz ya da süresi dolmuş. Yenisi için e-postanı yaz.',
          oldLink: 'Bu bağlantı uygulamanın içinde oluşturulmuş, burada kullanılamaz. Yenisi için aşağıya e-postanı yaz.'
        }
      }

      function lang() { return document.documentElement.lang === 'tr' ? 'tr' : 'en' }
      function $(id) { return document.getElementById(id) }
      var statusKey = null, statusKind = ''

      function paint() {
        var t = T[lang()]
        $('title').textContent = t.title
        $('request-help').textContent = t.requestHelp
        $('email-label').textContent = t.email
        $('request-btn').textContent = t.send
        $('set-help').textContent = t.setHelp
        $('pw-label').textContent = t.pw
        $('pw2-label').textContent = t.pw2
        $('set-btn').textContent = t.save
        setStatus(statusKey, statusKind)
      }
      function setStatus(key, kind) {
        statusKey = key; statusKind = kind || ''
        var el = $('status')
        el.textContent = key ? T[lang()][key] : ''
        el.className = 'status' + (kind ? ' ' + kind : '')
      }

      var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: false, autoRefreshToken: false }
      })

      var hash = location.hash || ''
      var query = location.search || ''
      var recovering = false

      client.auth.onAuthStateChange(function (event) {
        if (event === 'PASSWORD_RECOVERY') {
          recovering = true
          $('request-form').hidden = true
          $('set-form').hidden = false
          setStatus(null)
        }
      })

      if (/error_code|error_description/.test(hash)) setStatus('expired', 'error')
      else if (/[?&]code=/.test(query)) setStatus('oldLink', 'error')

      $('request-form').addEventListener('submit', function (e) {
        e.preventDefault()
        var btn = $('request-btn')
        btn.disabled = true
        var redirect = location.origin + location.pathname
        client.auth.resetPasswordForEmail($('email').value.trim(), { redirectTo: redirect })
          .then(function () { setStatus('sent', 'ok') })
          .catch(function () { setStatus('failed', 'error') })
          .then(function () { btn.disabled = false })
      })

      $('set-form').addEventListener('submit', function (e) {
        e.preventDefault()
        var a = $('pw').value, b = $('pw2').value
        if (a.length < 8) return setStatus('short', 'error')
        if (a !== b) return setStatus('mismatch', 'error')
        var btn = $('set-btn')
        btn.disabled = true
        client.auth.updateUser({ password: a })
          .then(function (res) {
            if (res.error) throw res.error
            $('set-form').hidden = true
            setStatus('done', 'ok')
            history.replaceState(null, '', location.pathname)
            return client.auth.signOut()
          })
          .catch(function () { setStatus('failed', 'error') })
          .then(function () { btn.disabled = false })
      })

      document.querySelectorAll('.lang-btn').forEach(function (b) { b.addEventListener('click', paint) })
      paint()
    })()
  </script>
</body>
</html>
